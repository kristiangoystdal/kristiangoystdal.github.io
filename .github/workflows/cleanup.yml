# Sletter rom og arkiv i Hide and Seek som ikke er brukt på 90 dager. Første dag i hver måned.
# Trenger hemmeligheten FIREBASE_SERVICE_ACCOUNT (en tjenestekontonøkkel fra Firebase-konsollen).
# Uten den hopper jobben over seg selv.
name: Rydd gamle rom

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Bare vis hva som ville blitt slettet'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "Mangler FIREBASE_SERVICE_ACCOUNT. Hopper over."
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/checkout@v4
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        working-directory: hide-and-seek-src
        run: |
          npm install --no-save --no-package-lock firebase-admin@13
          node scripts/cleanup-rooms.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
