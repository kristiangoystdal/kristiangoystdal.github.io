# Bygger, tester og publiserer hele nettsiden til GitHub Pages.
# Hide and Seek bygges alltid fra hide-and-seek-src (bygget ligger ikke i git). Testene (enhetstester,
# simulerte runder og klikk-tester som iPhone og Android) kjøres bare når noe i hide-and-seek-src er endret.
# Resten av nettsiden publiseres som den ligger.
name: Bygg, test og publiser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Én publisering om gangen. En publisering som er i gang, avbrytes ikke.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    # Fast versjon: Playwright 1.48 klarer ikke å installere nettleserne på Ubuntu 26 (ubuntu-latest fra oktober 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hide-and-seek-src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Er noe i Hide and Seek endret? Ved push sammenlignes med forrige commit på main, i en PR med main.
      # Startet for hånd (workflow_dispatch), eller uten noe å sammenligne med, kjøres alle testene.
      - name: Hva er endret
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then FROM="$BASE"; elif [ "$EVENT" = "push" ]; then FROM="$BEFORE"; else FROM=""; fi
          if [ -z "$FROM" ] || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            echo "Ingenting å sammenligne med: kjører alle testene."; echo "hs=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$FROM" HEAD | grep -q '^hide-and-seek-src/'; then
            echo "Hide and Seek er endret: kjører testene."; echo "hs=true" >> "$GITHUB_OUTPUT"
          else
            echo "Hide and Seek er ikke endret: hopper over testene."; echo "hs=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hide-and-seek-src/package-lock.json

      # Firebase-emulatoren (for databasereglene og delte oppsett) trenger Java.
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.hs == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Installer
        run: npm ci

      - name: Enhetstester og simulerte runder
        if: steps.changes.outputs.hs == 'true'
        run: npm run test:all

      - name: Bygg Hide and Seek
        run: npm run build
        env:
          # Firebase-nøklene ligger som hemmeligheter i repoet, ikke i koden (se hide-and-seek-src/.env.example).
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Installer nettlesere for klikk-testene
        if: steps.changes.outputs.hs == 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Klikk-tester som iPhone og Android
        if: steps.changes.outputs.hs == 'true'
        run: npm run e2e
        env:
          CI: true

      - name: Databasereglene, mot Firebase-emulatoren
        if: steps.changes.outputs.hs == 'true'
        run: npm run test:rules

      - name: Delte oppsett som iPhone og Android, mot Firebase-emulatoren
        if: steps.changes.outputs.hs == 'true'
        run: npm run e2e:firebase
        env:
          CI: true

      - name: Sett sammen nettsiden
        working-directory: .
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude 'hide-and-seek-src' --exclude '_site' --exclude '.DS_Store' ./ _site/
          # Uten Jekyll: filer som begynner med understrek (f.eks. assets/_gameId_-*.js) publiseres også.
          touch _site/.nojekyll

      - name: Firebase-nøkkelen inn i Rangeringshatten
        working-directory: .
        env:
          # Samme hemmeligheter som Hide and Seek. Rangeringshatten bruker samme database, i mappen rangeringshatten/.
          KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          sed -i "s|__FIREBASE_API_KEY__|$KEY|; s|__FIREBASE_APP_ID__|$APP_ID|" _site/rangeringshatten/firebase-config.js
          grep -q "__FIREBASE_API_KEY__" _site/rangeringshatten/firebase-config.js && { echo "Mangler Firebase-nøkkelen"; exit 1; } || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Bare fra main, og bare når alt over har bestått.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
