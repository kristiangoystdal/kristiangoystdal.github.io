<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #000;
  }
  .bg-video {
    position: fixed;
    top: 50%; left: 50%;
    min-width: 100%; min-height: 100%;
    width: auto; height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    filter: blur(18px) brightness(0.55);
    transform-origin: center;
    z-index: 0;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .label {
    font-size: clamp(14px, 3vw, 22px);
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 16px;
  }
  .timer {
    display: flex;
    gap: clamp(12px, 3vw, 28px);
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .unit .num {
    font-size: clamp(36px, 9vw, 90px);
    font-weight: 700;
    line-height: 1;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    font-variant-numeric: tabular-nums;
  }
  .unit .unit-label {
    font-size: clamp(10px, 2vw, 14px);
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-top: 6px;
  }
  .done {
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 700;
  }
</style>
</head>
<body>

<video class="bg-video" autoplay muted loop playsinline>
  <source src="YOUR_VIDEO_URL.mp4" type="video/mp4">
</video>

<div class="overlay">
  <div class="label">Countdown to</div>
  <div class="timer" id="timer">
    <div class="unit"><div class="num" id="days">00</div><div class="unit-label">Days</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="unit-label">Hours</div></div>
    <div class="unit"><div class="num" id="mins">00</div><div class="unit-label">Min</div></div>
    <div class="unit"><div class="num" id="secs">00</div><div class="unit-label">Sec</div></div>
  </div>
</div>

<script>
  // Set your target date/time here (ISO format, local time)
  const target = new Date("2026-08-21T18:00:00").getTime();

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) {
      document.getElementById('timer').innerHTML = '<div class="done">🎉 It\'s time! 🎉</div>';
      clearInterval(interval);
      return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);

    document.getElementById('days').textContent = pad(days);
    document.getElementById('hours').textContent = pad(hours);
    document.getElementById('mins').textContent = pad(mins);
    document.getElementById('secs').textContent = pad(secs);
  }

  tick();
  const interval = setInterval(tick, 1000);
</script>

</body>
</html>
