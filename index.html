<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Kristian Gøystdal</title>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128640;</text></svg>"
		/>
		<style>
			:root {
				--bg: #101317;
				--panel: #171b21;
				--panel-2: #1d2229;
				--border: #2a303a;
				--text: #e9edf2;
				--muted: #8b95a3;
				--accent: #e3350d;
				--accent-2: #3b6ceb;
			}
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
			}
			body {
				background: var(--bg);
				color: var(--text);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					sans-serif;
				display: flex;
				flex-direction: column;
				align-items: center;
				padding: clamp(32px, 8vh, 90px) 20px 40px;
			}

			header {
				text-align: center;
				margin-bottom: clamp(28px, 6vh, 56px);
			}
			h1 {
				font-size: clamp(26px, 5vw, 38px);
				letter-spacing: 0.3px;
			}
			h1 span {
				color: var(--accent);
			}
			.subtitle {
				color: var(--muted);
				margin-top: 8px;
				font-size: 15px;
			}

			.pages {
				width: 100%;
				max-width: 640px;
				display: flex;
				flex-direction: column;
				gap: 14px;
			}

			.page-card {
				display: flex;
				align-items: center;
				gap: 16px;
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 18px 20px;
				text-decoration: none;
				color: var(--text);
				transition:
					transform 0.15s ease,
					border-color 0.15s ease,
					background 0.15s ease;
			}
			.page-card:hover {
				transform: translateY(-2px);
				border-color: var(--accent-2);
				background: var(--panel-2);
			}
			.page-emoji {
				font-size: 30px;
				line-height: 1;
				flex-shrink: 0;
			}
			.page-info {
				flex: 1;
				min-width: 0;
			}
			.page-title {
				font-size: 17px;
				font-weight: 600;
			}
			.page-desc {
				color: var(--muted);
				font-size: 13.5px;
				margin-top: 3px;
			}
			.page-arrow {
				color: var(--muted);
				font-size: 18px;
				flex-shrink: 0;
			}

			footer {
				margin-top: auto;
				padding-top: 50px;
				color: var(--muted);
				font-size: 12.5px;
				text-align: center;
			}
			footer a {
				color: var(--accent-2);
				text-decoration: none;
			}
			footer a:hover {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Kristian <span>Gøystdal</span></h1>
			<p class="subtitle">A small collection of pages</p>
		</header>

		<div class="pages">
			<a class="page-card" href="pokedex/">
				<span class="page-emoji">📕</span>
				<span class="page-info">
					<span class="page-title">Pokédex Tracker</span>
					<span class="page-desc"
						>Track which Pokémon you've caught, grouped by generation, with
						cloud sync.</span
					>
				</span>
				<span class="page-arrow">→</span>
			</a>

			<a class="page-card" href="countdown/">
				<span class="page-emoji">🚂</span>
				<span class="page-info">
					<span class="page-title" id="countdownTitle">Countdown</span>
					<span class="page-desc" id="countdownDesc"
						>Countdown to a video from an Interrail trip across Europe.</span
					>
				</span>
				<span class="page-arrow">→</span>
			</a>
		</div>

		<footer>
			<a href="https://github.com/kristiangoystdal" target="_blank" rel="noopener"
				>github.com/kristiangoystdal</a
			>
		</footer>

		<script>
			fetch("countdown/config.json")
				.then((res) => (res.ok ? res.json() : null))
				.then((config) => {
					if (!config) return;
					const plainHeadline = config.headline.replace(/<[^>]+>/g, "");
					document.getElementById("countdownTitle").textContent =
						plainHeadline;
					const target = new Date(config.target);
					const dateLabel = isNaN(target)
						? config.footerLabel
						: target.toLocaleString(undefined, {
								dateStyle: "medium",
								timeStyle: "short",
							});
					document.getElementById("countdownDesc").textContent =
						`Counting down to ${dateLabel}.`;
				})
				.catch(() => {});
		</script>
	</body>
</html>
